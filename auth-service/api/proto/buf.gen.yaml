version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/madiyar/final-project/auth-service/api/gen

plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: ../gen
    opt:
      - paths=source_relative

  # Requires: go install github.com/envoyproxy/protoc-gen-validate/cmd/protoc-gen-validate@latest
  - local: protoc-gen-validate
    out: ../gen
    opt:
      - lang=go
      - paths=source_relative
