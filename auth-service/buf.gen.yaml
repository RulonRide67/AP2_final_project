version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/madiyar/final-project/auth-service/internal/delivery/grpc/gen
  # Keep PGV validate.proto on its upstream import path (not under gen/).
  disable:
    - file_option: go_package
      module: buf.build/envoyproxy/protoc-gen-validate

plugins:
  - remote: buf.build/protocolbuffers/go
    out: internal/delivery/grpc/gen
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: internal/delivery/grpc/gen
    opt:
      - paths=source_relative

  # Requires: go install github.com/envoyproxy/protoc-gen-validate/cmd/protoc-gen-validate@latest
  - local: protoc-gen-validate
    out: internal/delivery/grpc/gen
    opt:
      - lang=go
      - paths=source_relative
